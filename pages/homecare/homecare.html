  .cty-wrap {
    /* ── EDIT HERE ── */
    --cty-h: 360px;              /* visible height (set the Wix embed to this height) */

    --cty-green: #00544A;        /* text + icon */

    --cty-size: 18px;            /* pill text size */
    --cty-fade: 56px;            /* faded edge, top and bottom */

    display: flex;
    justify-content: center;
    gap: var(--cty-gap);
    width: 100%;
    height: var(--cty-h);
    overflow: hidden;
    box-sizing: border-box;
    font-family: 'Inter Tight', sans-serif;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,.04) calc(var(--cty-fade)*.15), rgba(0,0,0,.25) calc(var(--cty-fade)*.4), rgba(0,0,0,.62) calc(var(--cty-fade)*.7), #000 var(--cty-fade), #000 calc(100% - var(--cty-fade)), rgba(0,0,0,.62) calc(100% - var(--cty-fade)*.7), rgba(0,0,0,.25) calc(100% - var(--cty-fade)*.4), rgba(0,0,0,.04) calc(100% - var(--cty-fade)*.15), rgba(0,0,0,0) 100%);

  }
  .cty-wrap *, .cty-wrap *::before, .cty-wrap *::after { box-sizing: border-box; }

  .cty-col { flex: 0 1 var(--cty-col-w); min-width: 0; }
  .cty-track { display: flex; flex-direction: column; animation: cty-up var(--cty-speed) linear infinite; will-change: transform; }
  .cty-down .cty-track { animation-name: cty-down; animation-delay: calc(var(--cty-speed) * -0.5); }
  .cty-set { display: flex; flex-direction: column; gap: var(--cty-gap); padding-bottom: var(--cty-gap); }

  @keyframes cty-up   { from { transform: translate3d(0,0,0); } to { transform: translate3d(0,-33.3333333%,0); } }
  @keyframes cty-down { from { transform: translate3d(0,-33.3333333%,0); } to { transform: translate3d(0,0,0); } }
  @media (hover: hover) { .cty-wrap:hover .cty-track { animation-play-state: paused; } }

  .cty-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 24px;
    border-radius: 999px;
    background: var(--cty-bg);
    border: 1px solid var(--cty-line);
    color: var(--cty-green);
    font-weight: 600;
    font-size: var(--cty-size);
    line-height: 1.2;
    white-space: nowrap;
  }
  .cty-pin { flex: 0 0 auto; width: 16px; height: 16px; fill: var(--cty-green); opacity: .75; }

  @media (max-width: 600px) {
    .cty-wrap { --cty-h: 300px; --cty-col-w: 168px; --cty-gap: 12px; --cty-size: 14.5px; --cty-fade: 44px; --cty-speed: 18s; }

    .cty-track { animation: none !important; }
